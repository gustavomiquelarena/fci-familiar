name: Verificar aplicación
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: local
      - run: node tests/webcrypto_test.mjs
      - run: python -c "from fci_familiar.publication import assert_public_tree; assert_public_tree()"
        env:
          PYTHONPATH: local
